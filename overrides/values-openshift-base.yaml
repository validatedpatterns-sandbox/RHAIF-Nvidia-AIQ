#
# OpenShift platform overlay for deploy/helm/deployment-k8s.
# Applied via clusterGroup.applications.aiq.extraValueFiles.
#
# Pair with values-openshift-hybrid-lightning.yaml (values-prod.yaml).

aiq:
  apps:
    postgres:
      persistence:
        - name: aiq-postgres-data
          accessModes:
            - ReadWriteOnce
          size: 10Gi
    frontend:
      ingress:
        enabled: false
      route:
        enabled: true
