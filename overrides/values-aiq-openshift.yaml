#
# OpenShift overlay for the AI-Q umbrella chart (deploy/helm/deployment-k8s).
# Applied via clusterGroup.applications.aiq.extraValueFiles.
#
# Helm list values replace rather than merge — keep postgres-init when adding volumes.

aiq:
  apps:
    backend:
      env:
        CONFIG_FILE: /app/configs/config_maas_granite.yml
      volumeMounts:
        - name: maas-config
          mountPath: /app/configs/config_maas_granite.yml
          subPath: config_maas_granite.yml
          readOnly: true
      volumes:
        - name: postgres-init
          configMap:
            name: aiq-postgres-init
        - name: maas-config
          configMap:
            name: aiq-maas-config
    postgres:
      persistence:
        - name: aiq-postgres-data
          accessModes:
            - ReadWriteOnce
          size: 10Gi
    frontend:
      ingress:
        enabled: false
      route:
        enabled: true
