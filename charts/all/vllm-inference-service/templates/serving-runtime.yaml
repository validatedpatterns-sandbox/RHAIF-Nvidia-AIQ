apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  annotations:
    {{- toYaml .Values.vllmServingRuntime.annotations | nindent 4 }}
  name: {{ include "vllm-inference-service.fullname" . }}
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: '8080'
  containers:
    - args:
        {{- toYaml .Values.vllmServingRuntime.args | nindent 8 }}
        - {{ printf "--served-model-name=%s" (include "vllm-inference-service.servedModelName" .) }}
        - {{ printf "--port=%d" (int .Values.vllmServingRuntime.port) }}
      command:
        {{- toYaml .Values.vllmServingRuntime.command | nindent 8 }}
      env:
        - name: HF_HOME
          value: /cache
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              key: hftoken
              name: huggingface-secret
              optional: true
        - name: MODEL_ID
          value: {{ include "vllm-inference-service.hfRepo" . | quote }}
        - name: HF_HUB_OFFLINE
          value: '0'
      image: {{ include "vllm-inference-service.vllmImage" . | quote }}
      name: kserve-container
      ports:
        - containerPort: {{ .Values.vllmServingRuntime.port }}
          protocol: TCP
      volumeMounts:
        - mountPath: /dev/shm
          name: shm
        - mountPath: /cache
          name: {{ if .Values.modelCache.enabled }}model-cache{{ else }}cache{{ end }}
        {{- if not .Values.modelCache.enabled }}
        - mountPath: /cache/models
          name: models
        {{- end }}
        - mountPath: /.cache
          name: dotcache
        - mountPath: /.config
          name: dotconfig
        - mountPath: /.triton
          name: dottriton
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
    {{- if .Values.modelCache.enabled }}
    - name: model-cache
      persistentVolumeClaim:
        claimName: {{ include "vllm-inference-service.fullname" . }}-model-cache
    {{- else }}
    - name: models
      emptyDir: {}
    - name: cache
      emptyDir: {}
    {{- end }}
    - name: dotcache
      emptyDir: {}
    - name: dotconfig
      emptyDir: {}
    - name: dottriton
      emptyDir: {}
