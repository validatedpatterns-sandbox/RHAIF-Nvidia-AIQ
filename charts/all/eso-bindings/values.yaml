secretStore:
  name: vault-backend
  kind: ClusterSecretStore
vault:
  kvMount: secret/data
  prefix: hub
target:
  # Owner creates the Secret on a fresh cluster. Merge only updates an existing
  # Secret and fails when none exists (ESO: "secret won't be created").
  creationPolicy: Owner
  deletionPolicy: Retain
refreshInterval: 15s
