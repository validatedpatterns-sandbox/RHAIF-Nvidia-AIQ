# This goal of this metadata is mainly used as a source of truth for
# documentation and qe.
metadata_version: "1.0"
name: aiq
pattern_version: "1.0"
description: NVIDIA AI-Q research agent on OpenShift via Validated Patterns GitOps
display_name: NVIDIA AI-Q
repo_url: https://github.com/validatedpatterns-sandbox/RHAIF-Nvidia-AIQ
docs_repo_url: https://github.com/validatedpatterns/docs
issues_url: https://github.com/validatedpatterns-sandbox/RHAIF-Nvidia-AIQ/issues
docs_url: https://github.com/validatedpatterns-sandbox/RHAIF-Nvidia-AIQ/blob/main/docs/source/deployment/validated-patterns.md
# ci_url: omit until Validated Patterns CI exists
# can be sandbox, tested or maintained
tier: sandbox
owners: itay1551
requirements:
  hub: # Primary cluster. clusterGroupName is prod (single-cluster; no ACM hub/spoke).
    compute:
      platform:
        aws:
          replicas: 3
          type: m5.2xlarge
        azure:
          replicas: 3
          type: Standard_D8s_v4
        gcp:
          replicas: 3
          type: n1-standard-8
    controlPlane:
      platform:
        aws:
          replicas: 3
          type: m5.xlarge
        azure:
          replicas: 3
          type: Standard_D4s_v4
        gcp:
          replicas: 3
          type: n1-standard-4

# Loosely defined extra features like hypershift support, non-openshift
# kubernetes support, spoke support
extra_features:
  hypershift_support: false
  spoke_support: false

external_requirements:
  # This gets added as a note in the cluster sizing doc page
  cluster_sizing_note: >
    This pattern installs on a single OpenShift cluster (clusterGroupName
    prod). The instance types above are modest generic equivalents; the same
    footprint on any cloud or on-prem OpenShift cluster is sufficient. No GPU
    nodes are required for the default MaaS Granite overlay. For a future
    self-hosted RHOAI vLLM profile, provision GPU workers in Phase 0 (see
    GPU_provisioning.md; AWS default is two g6.2xlarge nodes via
    make create-gpu-machineset). A reachable MaaS or other LLM HTTP endpoint
    (AIQ_INFERENCE_BASE_URL) and model name are required. Tavily is optional
    for web research. The Postgres PVC uses the cluster default StorageClass.
